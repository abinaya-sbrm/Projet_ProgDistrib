apiVersion: apps/v1
kind: Deployment
metadata:
  name: service2
  namespace: projet
  labels:
    app: service2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service2
  template:
    metadata:
      labels:
        app: service2
    spec:
      containers:
      - name: service2
        image: <pseudo-dockerhub>/service2:latest   # à remplacer
        ports:
        - containerPort: 8081
          name: http
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: service2-service
  namespace: projet
  labels:
    app: service2
spec:
  selector:
    app: service2
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  type: ClusterIP
